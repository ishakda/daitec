<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Daitec — Configuration</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f7f8fa; color: #101828;
         display: flex; align-items: center; justify-content: center; min-height: 96vh; margin: 0; }
  .card { background: #fff; border: 1px solid #e4e7ec; border-radius: 16px; padding: 34px 38px;
          width: 430px; box-shadow: 0 1px 2px rgb(16 24 40 / .05); }
  h1 { font-size: 22px; margin: 0 0 2px; color: #14263f; letter-spacing: -.02em; }
  p { font-size: 13px; color: #667085; margin: 4px 0 20px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; color: #475467; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; height: 42px; border: 1px solid #d0d5dd; border-radius: 10px;
          padding: 0 12px; font-size: 14px; outline: none; }
  input:focus { border-color: #0e7569; box-shadow: 0 0 0 3px rgb(14 117 105 / .12); }
  button { margin-top: 16px; width: 100%; height: 42px; background: #0e7569; color: #fff; border: 0;
           border-radius: 10px; font-size: 14.5px; font-weight: 600; cursor: pointer; }
  button:hover { background: #0a5c52; }
  .err { color: #b42318; font-size: 12.5px; margin-top: 8px; min-height: 16px; }
  .hint { font-size: 11.5px; color: #98a2b3; margin-top: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Daitec</h1>
    <p>Entrez l'adresse de votre serveur Daitec — votre déploiement cloud
       (ex. <b>https://daitec.vercel.app</b>) ou un serveur local
       (ex. <b>http://192.168.1.10:3000</b>).</p>
    <label for="url">Adresse du serveur</label>
    <input id="url" type="url" placeholder="https://daitec.vercel.app" autofocus />
    <div class="err" id="err"></div>
    <button id="go">Se connecter</button>
    <div class="hint">Astuce : Ctrl+Shift+S rouvre cet écran à tout moment.</div>
  </div>
  <script>
    const input = document.getElementById("url");
    const err = document.getElementById("err");
    window.daitecDesktop.getServerUrl().then((u) => { if (u) input.value = u; });
    async function go() {
      err.textContent = "";
      const r = await window.daitecDesktop.setServerUrl(input.value.trim());
      if (!r.ok) err.textContent = r.error;
    }
    document.getElementById("go").addEventListener("click", go);
    input.addEventListener("keydown", (e) => e.key === "Enter" && go());
  </script>
</body>
</html>
